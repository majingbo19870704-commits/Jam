[package]
name = "personal-workstation"
version = "0.1.0"
description = "个人工作站 · Personal Workstation"
authors = ["majin"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "personal_workstation_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["unstable"] }
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
tauri-plugin-fs = "2"
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-os = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4"] }
argon2 = "0.5"
rand = "0.8"
anyhow = "1"
zip = { version = "2", default-features = false, features = ["deflate", "aes-crypto"] }
md5 = "0.7"
base64 = "0.22"
chrono = "0.4"
pathdiff = "0.2"
rusqlite = { version = "0.31", features = ["bundled"] }
csv = "1"
reqwest = { version = "0.12", default-features = false, features = ["native-tls", "json"] }
url = "2"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security_Cryptography", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
